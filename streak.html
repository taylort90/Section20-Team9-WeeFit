<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WeeFit Goal Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- LEFT SIDEBAR -->
    <div class="sidebar">
        <a href="#">Main Menu</a>
        <a href="#">Set Goals</a>
        <a href="#">Daily Check-In</a>
        <a href="#">Progress</a>
    </div>

    <!-- PAGE HEADER -->
    <div class="header">WeeFit Goal Tracker</div>

    <!-- MAIN CONTENT -->
    <div class="container">

        <!-- ENTER HEIGHT -->
        <div class="box">
            <h3>Enter Your Height</h3>
            <label>Your height (inches):</label>
            <input type="number" id="height">
            <br><br>
        </div>

        <!-- SELECT GOAL -->
        <div class="box">
            <h3>Select Your Fitness Goal</h3>

            <label><input type="radio" name="goal" value="skinny"> Skinny</label><br>
            <label><input type="radio" name="goal" value="toned"> Toned</label><br>
            <label><input type="radio" name="goal" value="bulk"> Bulk</label><br><br>

            <button onclick="showRecommendations()">Set Goal</button>
        </div>

        <!-- RECOMMENDED TARGETS -->
        <div class="box">
            <h3>Recommended Daily Targets</h3>
            <p>Calories: <span id="calorieRange">---</span></p>
            <p>Workout Minutes: <span id="workoutRange">---</span></p>
        </div>

        <!-- DAILY CHECK-IN -->
        <div class="box">
            <h3>Daily Check-In</h3>
            <label>Calories eaten today:</label>
            <input type="number" id="todayCalories"><br><br>

            <label>Workout minutes today:</label>
            <input type="number" id="todayWorkout"><br><br>

            <button onclick="evaluateDay()">Evaluate</button>
        </div>

        <!-- RESULTS SECTION -->
        <div class="box">
            <h3>Today's Evaluation</h3>
            <p id="resultMessage">Your progress will appear here.</p>
        </div>

        <!-- STREAK SECTION -->
        <div class="box">
            <h3>Your Streak</h3>
            <p>Current Streak: <span id="streakDisplay">0</span> days</p>
        </div>

    </div>

    <!-- ========================= -->
    <!--       JAVASCRIPT         -->
    <!-- ========================= -->
    <script>

        // GLOBAL RECOMMENDED RANGE VARIABLES
        let minCalories = 0, maxCalories = 0;
        let minWorkout = 0, maxWorkout = 0;
        let userGoal = "";

        // Load streak from localStorage or start at 0
        let streak = localStorage.getItem("streak") 
                        ? parseInt(localStorage.getItem("streak"))
                        : 0;

        document.getElementById("streakDisplay").textContent = streak;

        // Show recommended calories + workout minutes
        function showRecommendations() {

            let height = parseInt(document.getElementById("height").value);
            let goalOption = document.querySelector('input[name="goal"]:checked');

            if (!height || !goalOption) {
                alert("Please enter your height and select your goal.");
                return;
            }

            userGoal = goalOption.value;

            if (userGoal === "skinny") {
                minCalories = parseInt(height * 10);
                maxCalories = parseInt(height * 12);
                minWorkout = 30;
                maxWorkout = 60;
            }
            else if (userGoal === "toned") {
                minCalories = parseInt(height * 12);
                maxCalories = parseInt(height * 14);
                minWorkout = 40;
                maxWorkout = 75;
            }
            else { // bulk
                minCalories = parseInt(height * 14);
                maxCalories = parseInt(height * 17);
                minWorkout = 20;
                maxWorkout = 50;
            }

            document.getElementById("calorieRange").textContent =
                minCalories + " - " + maxCalories;

            document.getElementById("workoutRange").textContent =
                minWorkout + " - " + maxWorkout;
        }

        // Evaluate daily progress
        function evaluateDay() {
            let todayCalories = parseInt(document.getElementById("todayCalories").value);
            let todayWorkout = parseInt(document.getElementById("todayWorkout").value);

            if (!todayCalories || !todayWorkout) {
                alert("Please enter today's calories and workout minutes.");
                return;
            }

            let calorieOK = todayCalories >= minCalories && todayCalories <= maxCalories;
            let workoutOK = todayWorkout >= minWorkout && todayWorkout <= maxWorkout;

            let message = "";

            if (calorieOK && workoutOK) {
                streak++;
                message = "Great job! You are moving TOWARD your " + userGoal + " goal!";
            } else {
                streak = 0;
                message = "You are going AGAINST your " + userGoal + " goal today.";
            }

            // Save streak
            localStorage.setItem("streak", streak);
            document.getElementById("streakDisplay").textContent = streak;

            // Detailed feedback
            if (!calorieOK) {
                message += "<br>• Your calories were outside your range.";
            }
            if (!workoutOK) {
                message += "<br>• Your workout minutes were outside your range.";
            }

            document.getElementById("resultMessage").innerHTML = message;
        }

    </script>

</body>
</html>
